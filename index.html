
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#03040a">
<title>NEXORA — Neon Human</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #03040a;
  color: white;
  font-family: Arial, sans-serif;
}

#scene {
  position: fixed;
  inset: 0;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

.hud {
  position: fixed;
  inset: 0;
  padding: 22px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  pointer-events: none;
}

.top, .bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.logo {
  font-size: 13px;
  letter-spacing: 5px;
  color: #55f5ff;
  text-shadow: 0 0 15px #00d9ff;
}

.status {
  font-size: 9px;
  letter-spacing: 2px;
  color: #93a9c8;
}

.heading {
  position: absolute;
  left: 24px;
  top: 40%;
  transform: translateY(-50%);
  text-shadow: 0 0 25px #00cfff22;
}

.heading h1 {
  margin: 0;
  font-size: clamp(28px, 5vw, 55px);
  line-height: 1.08;
  letter-spacing: 4px;
}

.heading p {
  font-size: 9px;
  letter-spacing: 3px;
  color: #69eaff;
  line-height: 1.8;
}

.caption {
  color: #8499b7;
  font-size: 9px;
  line-height: 2;
  letter-spacing: 2px;
}

.controls {
  pointer-events: auto;
  display: flex;
  gap: 8px;
}

button {
  border: 1px solid #32dffb88;
  border-radius: 5px;
  padding: 11px 12px;
  color: #c6faff;
  background: #07131fe8;
  font-size: 9px;
  letter-spacing: 1px;
}

button:active {
  background: #12445a;
}

#hint {
  position: fixed;
  bottom: 82px;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 9px;
  letter-spacing: 2px;
  color: #6985a5;
  pointer-events: none;
}

#error {
  display: none;
  position: fixed;
  left: 16px;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  padding: 16px;
  border: 1px solid #31dffb88;
  background: #050a14ee;
  color: #b9f8ff;
  font-size: 13px;
  line-height: 1.7;
  z-index: 5;
}

@media (max-width: 600px) {
  .hud {
    padding: 15px;
  }

  .status {
    font-size: 7px;
    letter-spacing: 1px;
  }

  .heading {
    top: 25%;
    left: 16px;
  }

  .heading h1 {
    font-size: 29px;
    letter-spacing: 3px;
  }

  .heading p {
    font-size: 8px;
    letter-spacing: 1.5px;
  }

  .bottom {
    flex-direction: column;
    align-items: stretch;
  }

  .controls {
    width: 100%;
  }

  button {
    flex: 1;
    padding: 12px 4px;
    font-size: 8px;
  }

  #hint {
    bottom: 106px;
    font-size: 8px;
  }
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>
</head>

<body>
<div id="scene"></div>

<div class="hud">
  <div class="top">
    <div class="logo">NEXORA</div>
    <div class="status">HOLOGRAPHIC SYSTEM / ONLINE</div>
  </div>

  <div class="heading">
    <h1>NEON<br>HUMAN</h1>
    <p>IDENTITY · FUTURE · EVOLUTION</p>
  </div>

  <div class="bottom">
    <div class="caption">
      HUMAN PROJECT / 001<br>
      CYBER SPACE INTERFACE
    </div>

    <div class="controls">
      <button id="rotateBtn">ROTATION: ON</button>
      <button id="orbitBtn">ORBIT: ON</button>
      <button id="resetBtn">RESET</button>
    </div>
  </div>
</div>

<div id="hint">TOUCH AND DRAG TO ROTATE</div>
<div id="error"></div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js";

const errorBox = document.getElementById("error");

try {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x03040a);
  scene.fog = new THREE.FogExp2(0x03040a, 0.025);

  const camera = new THREE.PerspectiveCamera(
    40, innerWidth / innerHeight, 0.1, 100
  );

  camera.position.set(0, 0.1, 8.5);

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false
  });

  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.25;

  document.getElementById("scene").appendChild(renderer.domElement);

  // Ánh sáng môi trường
  scene.add(new THREE.AmbientLight(0x8aaaff, 2));

  const cyanLight = new THREE.PointLight(0x00eaff, 45, 20);
  cyanLight.position.set(-3, 2, 3);
  scene.add(cyanLight);

  const purpleLight = new THREE.PointLight(0x963cff, 50, 20);
  purpleLight.position.set(3, 1, -2);
  scene.add(purpleLight);

  const frontLight = new THREE.DirectionalLight(0xffffff, 2);
  frontLight.position.set(0, 3, 5);
  scene.add(frontLight);

  // Bầu trời sao
  const starPositions = [];

  for (let i = 0; i < 1200; i++) {
    starPositions.push(
      (Math.random() - 0.5) * 45,
      (Math.random() - 0.5) * 30,
      (Math.random() - 0.5) * 35 - 4
    );
  }

  const starGeometry = new THREE.BufferGeometry();

  starGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(starPositions, 3)
  );

  const stars = new THREE.Points(
    starGeometry,
    new THREE.PointsMaterial({
      color: 0x80cfff,
      size: 0.025,
      transparent: true,
      opacity: 0.85
    })
  );

  scene.add(stars);

  // Nhóm nhân vật
  const human = new THREE.Group();
  scene.add(human);

  // TÊN ẢNH CỦA MÀY ĐÃ ĐƯỢC ĐIỀN SẴN Ở ĐÂY
  const imageName = "./Picsart_26-10-28_00-49-00-589.png";

  new THREE.TextureLoader().load(
    imageName,
    texture => {
      texture.colorSpace = THREE.SRGBColorSpace;

      const material = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: false
      });

      const portrait = new THREE.Mesh(
        new THREE.PlaneGeometry(3.1, 4.5),
        material
      );

      portrait.position.y = -0.15;
      human.add(portrait);
    },
    undefined,
    () => {
      errorBox.style.display = "block";
      errorBox.textContent =
        "Không tải được ảnh. Hãy kiểm tra tên file PNG trong GitHub có khớp chính xác hay không.";
    }
  );

  // Nếu sau này có mô hình 3D avatar.glb,
  // mô hình sẽ thay ảnh PNG khi tải thành công.
  new GLTFLoader().load(
    "./avatar.glb",
    gltf => {
      human.clear();

      const model = gltf.scene;
      const bounds = new THREE.Box3().setFromObject(model);
      const size = bounds.getSize(new THREE.Vector3());
      const center = bounds.getCenter(new THREE.Vector3());

      const maxSize = Math.max(size.x, size.y, size.z) || 1;
      const scale = 4.2 / maxSize;

      model.scale.setScalar(scale);
      model.position.set(
        -center.x * scale,
        -center.y * scale,
        -center.z * scale
      );

      human.add(model);
      errorBox.style.display = "none";
    },
    undefined,
    () => {
      // Không có avatar.glb thì dùng ảnh PNG.
    }
  );

  // Các vòng quỹ đạo neon
  const rings = [];

  function createRing(radius, thickness, color, rotation, speed) {
    const geometry = new THREE.TorusGeometry(
      radius, thickness, 10, 180
    );

    const material = new THREE.MeshBasicMaterial({
      color,
      transparent: true,
      opacity: 0.88
    });

    const ring = new THREE.Mesh(geometry, material);

    ring.rotation.set(rotation[0], rotation[1], rotation[2]);
    ring.userData.speed = speed;

    scene.add(ring);
    rings.push(ring);
  }

  createRing(2.05, 0.018, 0x00eaff,
    [1.1, 0.2, 0.25], 0.45);

  createRing(2.35, 0.013, 0x963cff,
    [0.55, 0.7, 0.85], -0.32);

  createRing(1.8, 0.009, 0x478bff,
    [1.4, 0.2, 1.1], 0.6);

  // Những điểm sáng di chuyển quanh nhân vật
  const satellites = [];

  for (let i = 0; i < 3; i++) {
    const dot = new THREE.Mesh(
      new THREE.SphereGeometry(0.055, 16, 16),
      new THREE.MeshBasicMaterial({
        color: i === 1 ? 0xb86cff : 0x75faff
      })
    );

    scene.add(dot);
    satellites.push(dot);
  }

  // Điều khiển xoay bằng cảm ứng
  let dragging = false;
  let lastX = 0;
  let lastY = 0;
  let rotationY = 0;
  let rotationX = 0;
  let autoRotate = true;
  let orbitOn = true;

  renderer.domElement.addEventListener("pointerdown", e => {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;

    renderer.domElement.setPointerCapture(e.pointerId);
  });

  renderer.domElement.addEventListener("pointermove", e => {
    if (!dragging) return;

    rotationY += (e.clientX - lastX) * 0.008;
    rotationX += (e.clientY - lastY) * 0.005;

    rotationX = THREE.MathUtils.clamp(
      rotationX, -0.65, 0.65
    );

    lastX = e.clientX;
    lastY = e.clientY;
  });

  renderer.domElement.addEventListener("pointerup", () => {
    dragging = false;
  });

  renderer.domElement.addEventListener("pointercancel", () => {
    dragging = false;
  });

  document.getElementById("rotateBtn").onclick = e => {
    autoRotate = !autoRotate;

    e.currentTarget.textContent =
      "ROTATION: " + (autoRotate ? "ON" : "OFF");
  };

  document.getElementById("orbitBtn").onclick = e => {
    orbitOn = !orbitOn;

    rings.forEach(r => r.visible = orbitOn);
    satellites.forEach(s => s.visible = orbitOn);

    e.currentTarget.textContent =
      "ORBIT: " + (orbitOn ? "ON" : "OFF");
  };

  document.getElementById("resetBtn").onclick = () => {
    rotationX = 0;
    rotationY = 0;
    camera.position.set(0, 0.1, innerWidth < 600 ? 9.5 : 8.5);
  };

  // Chuyển động liên tục
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);

    const t = clock.getElapsedTime();

    if (autoRotate && !dragging) {
      rotationY += 0.003;
    }

    human.rotation.y +=
      (rotationY - human.rotation.y) * 0.06;

    human.rotation.x +=
      (rotationX - human.rotation.x) * 0.06;

    rings.forEach(r => {
      r.rotation.z += r.userData.speed * 0.003;
    });

    satellites.forEach((s, i) => {
      const a = t * (0.65 + i * 0.15) + i * 2.1;

      s.position.set(
        Math.cos(a) * (2.1 + i * 0.13),
        Math.sin(a * 1.3) * 0.65,
        Math.sin(a) * 1.45
      );
    });

    stars.rotation.y = t * 0.005;
    cyanLight.intensity = 40 + Math.sin(t * 1.5) * 5;
    purpleLight.intensity = 45 + Math.cos(t * 1.2) * 6;

    renderer.render(scene, camera);
  }

  function resize() {
    camera.aspect = innerWidth / innerHeight;
    camera.position.z = innerWidth < 600 ? 9.5 : 8.5;
    camera.updateProjectionMatrix();

    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(innerWidth, innerHeight);
  }

  addEventListener("resize", resize);

  resize();
  animate();

} catch (error) {
  errorBox.style.display = "block";
  errorBox.textContent =
    "Website chưa tải được hệ thống 3D. Hãy kiểm tra kết nối Internet và mở lại trang.";
  console.error(error);
}
</script>
</body>
</html>
